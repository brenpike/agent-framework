name: policy-check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  policy-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run validation
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bash ./tools/validate.sh --changed --base origin/main
          else
            bash ./tools/validate.sh --all
          fi
